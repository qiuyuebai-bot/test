<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>领域知识个性化生成与多智能体协同决策系统</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #f6f7fb; }
  .app-frame {
    position: fixed; inset: 0;
    width: 100%; height: 100%;
    border: 0; display: block;
  }
  .banner {
    position: fixed; top: 8px; right: 12px; z-index: 9999;
    background: rgba(17, 24, 39, 0.85); color: #fff;
    font: 12px/1.6 -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    padding: 6px 12px; border-radius: 8px;
    display: flex; align-items: center; gap: 8px;
  }
  .banner a { color: #60a5fa; }
</style>
</head>
<body>
  <div class="banner">
    <span>应用已嵌入 · 若显示空白请</span>
    <a href="http://localhost:5173/" target="_blank">在新标签页打开</a>
  </div>
  <iframe
    class="app-frame"
    id="app"
    src="http://127.0.0.1:5173/"
    title="应用预览"
    allow="fullscreen"
  ></iframe>
</body>
</html>
